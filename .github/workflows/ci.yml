name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/agent_branch
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: agent_branch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d agent_branch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The removable smevals PoC (issue #301) pins every invocation to
      # `uvx --from smevals==0.2.0 smevals`. This is the second-language
      # toolchain cost on the gate: uv setup + uvx fetch of smevals. The
      # deterministic contract checks and smoke matrix run here; the full
      # matrix and report artifacts run in the manual smevals-poc workflow.
      - name: Install uv (second-language PoC toolchain)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: npm ci
      - name: Dependency audit
        # CI lint/typecheck/test exercise dev tooling separately. Audit the
        # dependency graph that ships with the application.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # smevals PoC: deterministic static contract (no smevals execution) plus
      # the cheap smoke matrix (one successful sample per pair). The full
      # top-up matrix, resume, regrade and report artifacts are manual-workflow
      # concerns (see .github/workflows/smevals-poc.yml).
      - name: smevals PoC contract
        run: npm run poc:validate
      - name: smevals PoC smoke
        run: npm run poc:smoke
      # Deterministic doc-drift guard (also runs inside `npm test`; kept as a
      # named step for a clear CI signal). See scripts/check-doc-drift.mjs.
      - name: Doc drift (deterministic)
        run: npm run check:docs
      # Dead/unused code & exports. Advisory until baselined to green, then drop
      # `continue-on-error` to make it blocking.
      - name: Dead code (knip)
        run: npx knip
        continue-on-error: true
      # Visual regression (vitest browser mode, DESIGN.md §5.3). Advisory until
      # the committed baselines are confirmed stable on the Actions image, then
      # drop `continue-on-error` to make it blocking.
      - name: Install Chromium for visual tests
        run: npx playwright install chromium --with-deps
      - name: Visual tests (vitest browser mode)
        run: npm run test:visual
        continue-on-error: true
